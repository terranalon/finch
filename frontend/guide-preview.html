<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kraken Setup Guide Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f9fafb;
      --bg-tertiary: #f3f4f6;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --border-primary: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0f1117;
        --bg-secondary: #1a1d27;
        --bg-tertiary: #242736;
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --text-tertiary: #6b7280;
        --border-primary: #374151;
      }
      html { background: #0f1117; }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
    }
    .accent { color: #6366f1; }
    .bg-accent { background: #6366f1; }
    .btn-tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-tab.active {
      background: var(--bg-primary);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .btn-tab:not(.active) {
      background: transparent;
      color: var(--text-secondary);
    }
    .step-number {
      width: 2rem; height: 2rem;
      border-radius: 50%;
      background: #6366f1;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.875rem;
      flex-shrink: 0;
    }
    .chevron { transition: transform 0.2s; }
    .chevron.open { transform: rotate(180deg); }
    .troubleshoot-answer { display: none; }
    .troubleshoot-answer.open { display: block; }
  </style>
</head>
<body>
  <div style="max-width: 672px; margin: 0 auto;">
    <!-- Header -->
    <div style="position: sticky; top: 0; z-index: 10; background: var(--bg-primary); border-bottom: 1px solid var(--border-primary); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;">
      <div>
        <h2 id="panel-title" style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary); margin: 0;">Connect Kraken API</h2>
        <p style="font-size: 0.875rem; color: var(--text-tertiary); margin: 0.25rem 0 0 0;">Step-by-step guide</p>
      </div>
    </div>

    <!-- Tab Switcher -->
    <div style="display: flex; gap: 0.5rem; padding: 0.375rem; margin: 1.5rem; background: var(--bg-tertiary); border-radius: 0.75rem;">
      <button class="btn-tab active" onclick="showGuide('api')">API Connection</button>
      <button class="btn-tab" onclick="showGuide('file')">File Export</button>
    </div>

    <div id="guide-content" style="padding: 0 1.5rem 2rem;">
    </div>
  </div>

  <script>
    const guides = {
      api: {
        title: 'Connect Kraken API',
        overview: 'Connect your Kraken account to automatically import your trades, deposits, withdrawals, and staking rewards. New transactions are synced periodically.',
        estimatedTime: '5 minutes',
        prerequisites: [
          'A verified Kraken account',
          '2FA enabled (recommended for API key creation)',
        ],
        steps: [
          { title: 'Open Settings', description: 'Log into your Kraken account. Click the profile icon in the top-right corner, then select "Settings" from the dropdown menu.', screenshot: 'public/guides/kraken/api/home_with_settings.png' },
          { title: 'Go to Connections & API', description: 'On the Settings page, click the "Connections & API" tab in the top navigation bar.', screenshot: 'public/guides/kraken/api/settings.png' },
          { title: 'Create a New API Key', description: 'Click the purple "Create API key" button on the right side of the Spot trading API section.', screenshot: 'public/guides/kraken/api/connections_and_apis.png' },
          { title: 'Name Your Key', description: 'In the "Add API key" dialog, enter a descriptive name such as "Finch Portfolio Tracker". This helps you identify the key later.', screenshot: 'public/guides/kraken/api/add_api_key.png' },
          { title: 'Set Permissions', description: 'Enable only the read permissions needed for portfolio tracking. The permissions are organized in three columns:', screenshot: 'public/guides/kraken/api/add_api_key_example.png', checklist: [
              { label: 'Query (under Funds permissions)', required: true },
              { label: 'Query closed orders & trades (under Orders and trades)', required: true },
              { label: 'Query ledger entries (under Data)', required: true },
              { label: 'Export data (under Data)', required: false },
            ], tip: 'Never enable "Withdraw", "Create & modify orders", or "Deposit" permissions. Finch only needs read access to import your data.' },
          { title: 'Confirm with 2FA', description: 'Click "Generate key" at the bottom of the dialog. If you have 2FA enabled, you will be asked to verify with your passkey or authenticator app.', screenshot: 'public/guides/kraken/api/add_api_key_step_2.png', optional: true },
          { title: 'Copy Your Credentials', description: 'Your API key has been created. Copy both the API Key and the Private Key using the copy buttons. The Private Key is only shown once -- save it immediately.', screenshot: 'public/guides/kraken/api/api_key_final_step.png', tip: 'Store your Private Key in a password manager. If you lose it, you will need to create a new key.' },
          { title: 'Enter Credentials in Finch', description: 'Paste your API Key and Private Key into the fields below, then click "Test Connection" to verify everything works.' },
        ],
        security: {
          recommended: [
            'Enable only read permissions (Query Funds, Query Closed Orders & Trades, Query Ledger Entries)',
            'Use a unique API key for Finch -- do not reuse keys from other services',
          ],
          avoid: [
            'Withdraw Funds permission',
            'Create & Modify Orders permission',
            'Sharing your Private Key with anyone',
          ],
          note: 'Your credentials are encrypted and stored securely. Finch only uses read-only access to import your data. You can revoke the key at any time from Kraken.',
        },
        dataScope: [
          { type: 'Trades', included: true, note: 'Buy and sell orders across all trading pairs' },
          { type: 'Deposits', included: true, note: 'Crypto and fiat deposits' },
          { type: 'Withdrawals', included: true, note: 'Crypto and fiat withdrawals' },
          { type: 'Staking Rewards', included: true, note: 'Imported via ledger entries' },
          { type: 'Internal Transfers', included: true, note: 'Between Kraken sub-accounts' },
          { type: 'Margin / Futures', included: false, note: 'Only spot trading is supported' },
        ],
        limitations: [
          'Only spot trading data is imported (no margin or futures)',
          'API rate limit: ~15 requests per minute',
        ],
        troubleshooting: [
          { problem: '"Invalid key" or "Permission denied" error', solution: 'Check that you copied the full API Key and Private Key without leading/trailing spaces. Ensure "Query Funds", "Query Closed Orders & Trades", and "Query Ledger Entries" permissions are all enabled.' },
          { problem: 'Missing staking rewards', solution: 'Staking rewards appear as ledger entries, not trades. Ensure "Query Ledger Entries" is enabled on your API key.' },
          { problem: 'Connection times out', solution: 'Kraken may be experiencing high traffic. Wait a few minutes and try again.' },
        ],
        afterSetup: 'Once connected, Finch will automatically sync new transactions from Kraken. You can trigger a manual sync from your account settings at any time.',
      },
      file: {
        title: 'Export from Kraken',
        overview: 'Import your Kraken transaction history from a CSV export. This is useful for a one-time import or for importing historical data.',
        estimatedTime: '3 minutes',
        prerequisites: [
          'A Kraken account with transaction history',
          'Access to the Kraken Pro interface',
        ],
        steps: [
          { title: 'Open History', description: 'Log into your Kraken account. Click "History" in the left navigation bar to view your transaction history.', screenshot: 'public/guides/kraken/file/history.png' },
          { title: 'View Statements', description: 'On the History page, click the "View statements" link in the top-right corner. This opens the Statements page where you can export data.', screenshot: 'public/guides/kraken/file/history.png' },
          { title: 'Export Statement', description: 'Click the purple "Export statement" button in the top-right corner of the Statements page.', screenshot: 'public/guides/kraken/file/statements.png' },
          { title: 'Select Ledger Export', description: 'In the "Export statement" dialog, select "Ledger" from the dropdown menu.', screenshot: 'public/guides/kraken/file/export_statement_step_1.png', tip: 'Choose "Ledger" (not "Trades" or "Account Statement"). The ledger includes all transaction types: trades, deposits, withdrawals, and staking rewards.' },
          { title: 'Configure Export', description: 'Set the start date to the date you created your Kraken account -- we need your entire transaction history for accurate portfolio tracking. Leave Transaction types, Assets, and Fields on "All". Important: change the Format from PDF to CSV.', screenshot: 'public/guides/kraken/file/export_statement_pick_format.png', tip: 'The default format is PDF -- make sure to switch it to CSV before submitting. If you are unsure when you opened your account, set the start date as far back as possible.' },
          { title: 'Download the Export', description: 'Click "Submit" and wait for the export to generate. Once ready, it will appear under "On-demand statements" with a download icon. Click the download icon to save the CSV file.', screenshot: 'public/guides/kraken/file/export_statement_ready_to_download.png' },
          { title: 'Upload to Finch', description: 'Switch to the "Upload File" tab in Finch and drag the downloaded CSV file into the upload area, or click to browse for it.' },
        ],
        dataScope: [
          { type: 'Trades', included: true, note: 'Buy and sell orders' },
          { type: 'Deposits', included: true, note: 'Crypto and fiat' },
          { type: 'Withdrawals', included: true, note: 'Crypto and fiat' },
          { type: 'Staking Rewards', included: true, note: 'Included in ledger exports' },
          { type: 'Internal Transfers', included: true, note: 'Between sub-accounts' },
        ],
        limitations: [
          'File must be the original Kraken CSV export (not modified)',
          'Large exports may take a few minutes to generate on Kraken',
        ],
        troubleshooting: [
          { problem: '"Unsupported file format" error', solution: 'Make sure you exported as CSV (not the default PDF). If you already exported as PDF, create a new export and change the format to CSV.' },
          { problem: 'Wrong export type selected', solution: 'Use "Ledger" export, not "Trades" or "Account Statement". The ledger format includes all transaction types that Finch needs.' },
          { problem: 'Missing transactions in import', solution: 'Check the date range of your export. If it does not cover your full history, create a new export with a wider range.' },
        ],
      },
    };

    function showGuide(type) {
      const guide = guides[type];
      document.getElementById('panel-title').textContent = guide.title;

      // Update tab buttons
      document.querySelectorAll('.btn-tab').forEach((btn, i) => {
        btn.classList.toggle('active', (type === 'api' && i === 0) || (type === 'file' && i === 1));
      });

      let html = '';

      // Overview
      html += `<div style="padding: 1.25rem; border-radius: 0.75rem; background: #eef2ff; border: 1px solid #c7d2fe; margin-bottom: 2rem;">
        <p style="font-size: 0.875rem; color: #3730a3; margin: 0;">${guide.overview}</p>
        ${guide.estimatedTime ? `<div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.75rem; font-size: 0.75rem; color: #4f46e5;">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
          <span>Estimated time: ${guide.estimatedTime}</span>
        </div>` : ''}
      </div>`;

      // Prerequisites
      if (guide.prerequisites?.length) {
        html += `<div style="margin-bottom: 2rem;">
          <h3 style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.75rem 0;">Before you start</h3>
          <ul style="list-style: none; padding: 0; margin: 0;">
            ${guide.prerequisites.map(p => `<li style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.875rem; color: var(--text-primary); margin-bottom: 0.5rem;">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#6366f1" style="flex-shrink:0; margin-top: 2px;"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
              ${p}
            </li>`).join('')}
          </ul>
        </div>`;
      }

      // Steps
      html += `<div style="margin-bottom: 2rem;">
        <h3 style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 1rem 0;">Steps</h3>
        <div style="display: flex; flex-direction: column; gap: 1.5rem;">`;

      guide.steps.forEach((step, i) => {
        html += `<div style="display: flex; gap: 1rem;">
          <div class="step-number">${i + 1}</div>
          <div style="flex: 1; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <h4 style="font-weight: 600; color: var(--text-primary); margin: 0;">${step.title}</h4>
              ${step.optional ? '<span style="font-size: 0.75rem; padding: 0.125rem 0.5rem; border-radius: 9999px; background: var(--bg-tertiary); color: var(--text-tertiary);">optional</span>' : ''}
            </div>
            <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0.25rem 0 0 0;">${step.description}</p>`;

        if (step.checklist) {
          html += `<div style="margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.375rem;">`;
          step.checklist.forEach(item => {
            html += `<div style="display: flex; align-items: center; gap: 0.5rem;">
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="${item.required ? '#6366f1' : 'var(--text-tertiary)'}"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
              <span style="font-size: 0.875rem; ${item.required ? 'font-weight: 500; color: var(--text-primary);' : 'color: var(--text-secondary);'}">${item.label}${item.required ? '<span style="font-size: 0.75rem; color: #6366f1; margin-left: 0.25rem;">(required)</span>' : ''}</span>
            </div>`;
          });
          html += `</div>`;
        }

        if (step.tip) {
          html += `<div style="margin-top: 0.75rem; display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.75rem; border-radius: 0.5rem; background: #fffbeb; border: 1px solid #fde68a;">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#d97706" style="flex-shrink:0; margin-top: 2px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18"/></svg>
            <p style="font-size: 0.75rem; color: #92400e; margin: 0;">${step.tip}</p>
          </div>`;
        }

        if (step.screenshot) {
          const imgId = `screenshot-${type}-${i}`;
          html += `<div style="margin-top: 0.75rem; border-radius: 0.5rem; overflow: hidden; border: 1px solid var(--border-primary); cursor: pointer;" onclick="expandImage('${step.screenshot}', 'Step ${i + 1}: ${step.title}')">
            <img src="${step.screenshot}" alt="Step ${i + 1}: ${step.title}" style="width: 100%; display: block;" loading="lazy" />
            <div style="padding: 0.375rem 0.75rem; background: var(--bg-tertiary); text-align: center; font-size: 0.75rem; color: var(--text-tertiary);">Click to expand</div>
          </div>`;
        }

        html += `</div></div>`;
      });
      html += `</div></div>`;

      // Security
      if (guide.security) {
        html += `<div style="margin-bottom: 2rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
            <div style="padding: 0.5rem; border-radius: 0.5rem; background: #d1fae5; color: #059669;">
              <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
            </div>
            <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text-primary); margin: 0;">Security Best Practices</h3>
          </div>
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
              <p style="font-size: 0.75rem; font-weight: 600; color: #16a34a; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.5rem 0;">Recommended</p>
              <ul style="list-style: none; padding: 0; margin: 0;">
                ${guide.security.recommended.map(item => `<li style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.875rem; color: var(--text-primary); margin-bottom: 0.375rem;">
                  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#16a34a" style="flex-shrink:0; margin-top: 2px;"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                  ${item}
                </li>`).join('')}
              </ul>
            </div>
            <div>
              <p style="font-size: 0.75rem; font-weight: 600; color: #dc2626; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 0.5rem 0;">Avoid</p>
              <ul style="list-style: none; padding: 0; margin: 0;">
                ${guide.security.avoid.map(item => `<li style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.875rem; color: var(--text-primary); margin-bottom: 0.375rem;">
                  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#dc2626" style="flex-shrink:0; margin-top: 2px;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                  ${item}
                </li>`).join('')}
              </ul>
            </div>
            <p style="font-size: 0.75rem; color: var(--text-tertiary); font-style: italic; margin: 0;">${guide.security.note}</p>
          </div>
        </div>`;
      }

      // Data Scope
      if (guide.dataScope?.length) {
        html += `<div style="margin-bottom: 2rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
            <div style="padding: 0.5rem; border-radius: 0.5rem; background: #dbeafe; color: #2563eb;">
              <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
            </div>
            <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text-primary); margin: 0;">What Gets Imported</h3>
          </div>
          <div style="overflow: hidden; border-radius: 0.75rem; border: 1px solid var(--border-primary);">
            <table style="width: 100%; font-size: 0.875rem; border-collapse: collapse;">
              <thead>
                <tr style="background: var(--bg-tertiary);">
                  <th style="text-align: left; padding: 0.625rem 1rem; font-weight: 600; color: var(--text-secondary);">Data Type</th>
                  <th style="text-align: center; padding: 0.625rem 1rem; font-weight: 600; color: var(--text-secondary); width: 80px;">Status</th>
                  <th style="text-align: left; padding: 0.625rem 1rem; font-weight: 600; color: var(--text-secondary);">Notes</th>
                </tr>
              </thead>
              <tbody>
                ${guide.dataScope.map(row => `<tr style="border-top: 1px solid var(--border-primary);">
                  <td style="padding: 0.625rem 1rem; font-weight: 500; color: var(--text-primary);">${row.type}</td>
                  <td style="padding: 0.625rem 1rem; text-align: center;">${row.included
                    ? '<svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#16a34a" style="display:inline;"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>'
                    : '<svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="var(--text-tertiary)" style="display:inline;"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>'
                  }</td>
                  <td style="padding: 0.625rem 1rem; color: var(--text-secondary);">${row.note}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
      }

      // Limitations
      if (guide.limitations?.length) {
        html += `<div style="padding: 1rem; border-radius: 0.75rem; background: #fffbeb; border: 1px solid #fde68a; margin-bottom: 2rem;">
          <h4 style="font-size: 0.875rem; font-weight: 600; color: #92400e; margin: 0 0 0.5rem 0;">Limitations</h4>
          <ul style="list-style: none; padding: 0; margin: 0;">
            ${guide.limitations.map(l => `<li style="display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.875rem; color: #a16207; margin-bottom: 0.375rem;">
              <span style="color: #d97706; margin-top: 0.25rem;">-</span> ${l}
            </li>`).join('')}
          </ul>
        </div>`;
      }

      // Troubleshooting
      if (guide.troubleshooting?.length) {
        html += `<div style="margin-bottom: 2rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
            <div style="padding: 0.5rem; border-radius: 0.5rem; background: #ffedd5; color: #ea580c;">
              <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008Z"/></svg>
            </div>
            <h3 style="font-size: 1.125rem; font-weight: 700; color: var(--text-primary); margin: 0;">Troubleshooting</h3>
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            ${guide.troubleshooting.map((item, i) => `<div style="border: 1px solid var(--border-primary); border-radius: 0.5rem; overflow: hidden;">
              <button onclick="toggleTroubleshoot(${i}, '${type}')" style="width: 100%; display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; text-align: left; background: transparent; border: none; cursor: pointer; color: var(--text-primary);">
                <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#f59e0b" style="flex-shrink:0;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
                <span style="flex: 1; font-size: 0.875rem; font-weight: 500;">${item.problem}</span>
                <svg id="chevron-${type}-${i}" class="chevron" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="var(--text-tertiary)"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
              </button>
              <div id="answer-${type}-${i}" class="troubleshoot-answer" style="padding: 0 1rem 0.75rem 3.25rem;">
                <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0;">${item.solution}</p>
              </div>
            </div>`).join('')}
          </div>
        </div>`;
      }

      // After Setup
      if (guide.afterSetup) {
        html += `<div style="padding: 1.25rem; border-radius: 0.75rem; background: #f0fdf4; border: 1px solid #bbf7d0; margin-bottom: 2rem;">
          <h4 style="font-weight: 600; color: #16a34a; margin: 0 0 0.5rem 0;">After setup</h4>
          <p style="font-size: 0.875rem; color: #15803d; margin: 0;">${guide.afterSetup}</p>
        </div>`;
      }

      // Help
      html += `<div style="padding: 1.25rem; border-radius: 0.75rem; background: var(--bg-secondary); border: 1px solid var(--border-primary);">
        <h4 style="font-weight: 600; color: var(--text-primary); margin: 0 0 0.5rem 0;">Need help?</h4>
        <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0;">If you're having trouble, check out our FAQ or contact support.</p>
      </div>`;

      document.getElementById('guide-content').innerHTML = html;
    }

    function toggleTroubleshoot(index, type) {
      const answer = document.getElementById(`answer-${type}-${index}`);
      const chevron = document.getElementById(`chevron-${type}-${index}`);
      answer.classList.toggle('open');
      chevron.classList.toggle('open');
    }

    function expandImage(src, alt) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);padding:1rem;cursor:pointer;';
      overlay.onclick = () => overlay.remove();
      const img = document.createElement('img');
      img.src = src;
      img.alt = alt;
      img.style.cssText = 'max-width:100%;max-height:100%;border-radius:0.5rem;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);object-fit:contain;';
      img.onclick = (e) => e.stopPropagation();
      const closeBtn = document.createElement('button');
      closeBtn.innerHTML = '&times;';
      closeBtn.style.cssText = 'position:absolute;top:1rem;right:1rem;width:2.5rem;height:2.5rem;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:white;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;';
      closeBtn.onclick = () => overlay.remove();
      overlay.appendChild(img);
      overlay.appendChild(closeBtn);
      document.body.appendChild(overlay);
    }

    // Init
    showGuide('api');
  </script>
</body>
</html>
