# See https://pre-commit.com for more information
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && uv run ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check --fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ty-check
        name: ty type check
        entry: bash -c 'cd backend && uv run ty check'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
